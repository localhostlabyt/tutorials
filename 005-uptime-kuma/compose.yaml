services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2.5.11
    restart: always
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/caddy-root.crt
    extra_hosts:
      - "git.home.arpa:host-gateway"
      - "vault.home.arpa:host-gateway"
    volumes:
      - ./data:/app/data
      - ./caddy-root.crt:/certs/caddy-root.crt:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
